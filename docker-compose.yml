services:
  torbox-downloader:
    # Pull the published image (recommended)...
    image: ghcr.io/devblaze/torbox-client:latest
    # ...or build locally instead by commenting the image line and uncommenting:
    # build: .
    container_name: torbox-downloader
    restart: unless-stopped
    env_file: .env
    environment:
      - PUID=1000          # set to 99 on Unraid
      - PGID=1000          # set to 100 on Unraid
      - UMASK=022
    # With a dedicated macvlan IP you reach the container directly at
    # http://192.168.4.210:8080, so no host port mapping is needed.
    # (If you use the bridge network instead, re-add: ports: ["8080:8080"])
    volumes:
      # IMPORTANT: this MUST be the same host directory that Sonarr/Radarr mount
      # as /downloads, so the paths line up and imports (hardlinks) work.
      - /mnt/user/Downloads:/downloads
      - ./data:/data        # SQLite state — keep it persistent
    networks:
      lan:
        ipv4_address: 192.168.4.210

networks:
  lan:
    driver: macvlan          # gives the container its own IP on your LAN
    driver_opts:
      parent: bond0          # the host interface (bond0 / eth0 / br0)
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.1   # your router's IP

# ---------------------------------------------------------------------------
# Notes for the macvlan setup above:
#
# * Pick an IP OUTSIDE your router's DHCP pool (or reserve it) to avoid clashes.
#   192.168.4.210 must be on the same subnet as `parent` (192.168.4.0/24 here).
#
# * macvlan limitation: the Docker HOST cannot talk to this container directly
#   (host <-> macvlan traffic is blocked by the kernel). If Sonarr/Radarr run on
#   the SAME host in bridge/host networking, they will NOT reach 192.168.4.210
#   unless you add a "macvlan shim" on the host, e.g.:
#     ip link add shim link bond0 type macvlan mode bridge
#     ip addr add 192.168.4.209/32 dev shim && ip link set shim up
#     ip route add 192.168.4.210/32 dev shim
#   (On Unraid, enabling "Host access to custom networks" does this for you.)
#   If Sonarr/Radarr are on OTHER machines/containers, they reach it fine.
#
# * Shared downloads volume: Sonarr/Radarr and this container must see completed
#   files at the SAME path. If the *arr apps mount the same host dir at a
#   different internal path (e.g. /data/downloads), set SAVE_PATH in .env to
#   that path so the reported paths match theirs.
# ---------------------------------------------------------------------------
